name: vk_engine_churn_repro
description: "MRE harness for flutter/flutter#191168: Impeller Vulkan vkDestroyFramebuffer crash under background FlutterEngine churn."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Same plugin and major version the production app uses to run periodic
  # background work. Each Android task execution spawns a fresh background
  # FlutterEngine (with its own Impeller Vulkan context) and destroys it
  # when the task completes.
  workmanager: ^0.10.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
